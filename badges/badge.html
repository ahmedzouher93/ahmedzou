<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Barlow+Semi+Condensed:wght@500;600&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
:root{--blue:#1B75BB;--navy:#0A2A52;--green:#8DC063;--purple:#7B2A80;--sky:#7DB8E6;}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1067px;height:1600px;background:var(--blue);overflow:hidden;font-family:Archivo,sans-serif}
.card{position:relative;width:1067px;height:1600px;background:var(--blue)}
.slot{position:absolute;left:462px;top:88px;width:186px;height:38px;border-radius:19px;background:var(--navy)}
.title{position:absolute;left:0;right:0;top:205px;text-align:center;color:#fff;font-weight:800;font-stretch:125%;line-height:.9;letter-spacing:-2px;white-space:nowrap}
svg.art{position:absolute;left:0;top:0}
.name{position:absolute;left:92px;top:1175px;width:880px;height:150px;background:var(--green);border-radius:75px;transform:rotate(-4deg);display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:800;font-stretch:125%;font-size:84px;letter-spacing:-1px;white-space:nowrap;box-shadow:0 10px 0 rgba(10,42,82,.25)}
.co{position:absolute;left:500px;top:1242px;height:86px;padding:0 40px;background:var(--purple);border-radius:43px;display:flex;align-items:center;color:#fff;font-family:'Barlow Semi Condensed',sans-serif;font-weight:600;font-size:46px;letter-spacing:2px;box-shadow:0 0 0 6px var(--blue)}
.strip{position:absolute;left:0;right:0;bottom:0;height:140px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 72px}
.foot{color:var(--navy);font-family:Inter,Arial,sans-serif;font-weight:600;font-size:28px;letter-spacing:0;line-height:1}
.wm{height:74px}
</style></head><body><div class="card">
<div class="slot"></div>
<div class="title"><span id="t" style="display:inline-block">PROJECT<br>MANAGER</span></div>

<svg class="art" width="1067" height="1600" viewBox="0 0 1067 1600">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3d42"/><stop offset="1" stop-color="#1c1c20"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d6d9"/><stop offset="1" stop-color="#b7b3b8"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfc9cc"/><stop offset="1" stop-color="#8f888c"/></linearGradient>
  </defs>
  <!-- sun rays behind photo -->
  <g id="rays" fill="var(--navy)"></g>
  <!-- starbursts -->
  <g id="b1" transform="translate(145,610)" fill="var(--green)"></g>
  <g id="b2" transform="translate(1040,665)" fill="var(--sky)"></g>
  <!-- photo placeholder (cut-out sticker) -->
  <image href="laith-photo.png" x="141" y="535" width="800" height="746" preserveAspectRatio="xMidYMax meet"/>
</svg>

<div class="name">LAITH DWAIRY</div>
<div class="strip"><div class="foot">BlueRay Web Solutions · Staff</div><img class="wm" src="logo-wordmark.png"></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
function burst(id,n,r0,r1,w){const g=document.getElementById(id);for(let i=0;i<n;i++){const r=document.createElementNS(NS,'rect');r.setAttribute('x',r0);r.setAttribute('y',-w/2);r.setAttribute('width',r1-r0);r.setAttribute('height',w);r.setAttribute('transform',`rotate(${i*360/n})`);g.appendChild(r);}}
burst('b1',16,28,102,15);burst('b2',14,24,86,14);
// sun rays radiating from behind the portrait
const rays=document.getElementById('rays');
[[190,1150],[160,1150],[132,1150],[48,1150],[20,1150],[-8,1150]].forEach(([a])=>{
  const r=document.createElementNS(NS,'rect');r.setAttribute('x',320);r.setAttribute('y',-42);r.setAttribute('width',200);r.setAttribute('height',84);r.setAttribute('rx',6);
  r.setAttribute('transform',`translate(541,1205) rotate(${-a})`);rays.appendChild(r);});
document.fonts.ready.then(()=>{const t=document.getElementById('t');let s=200;t.style.fontSize=s+'px';
  while(t.offsetWidth>740&&s>60){s-=2;t.style.fontSize=s+'px';} document.body.dataset.ready=1;});
</script>
</body></html>
